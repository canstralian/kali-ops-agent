[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kali-ops-agent"
version = "0.1.0"
description = "Governance-first MCP framework for authorized purple-team operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "canstralian" }]
keywords = ["mcp", "security", "purple-team", "governance", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Pinned below 2.0: MCP Python SDK v2 removed mcp.server.fastmcp.FastMCP, which
# server.py imports. Lift this ceiling only alongside a migration to the v2 API.
server = ["mcp>=1.2.0,<2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
kali-ops-agent = "kali_ops_agent.server:main"

[project.urls]
Homepage = "https://github.com/canstralian/kali-ops-agent"
Issues = "https://github.com/canstralian/kali-ops-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kali_ops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
