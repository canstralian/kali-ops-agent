name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed advisories against pinned deps surface even
    # without a push.
    - cron: "17 4 * * 1"

# Least privilege: read-only token for the whole workflow.
permissions:
  contents: read

jobs:
  dependency-audit:
    name: pip-audit (runtime deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Audit declared runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Audit only the project's declared runtime dependencies (from
          # pyproject) and their resolved tree — not the runner's base tooling —
          # so the gate reflects what actually ships, and fails only on an
          # advisory in our own dependency closure.
          python - <<'PY' > runtime-requirements.txt
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          for dep in data["project"]["dependencies"]:
              print(dep)
          PY
          echo "Auditing:" && cat runtime-requirements.txt
          pip-audit -r runtime-requirements.txt --desc

  sast:
    name: bandit (static analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Static analysis of the source
        run: |
          pip install bandit
          # Fail on medium+ findings. The current tree has only low-severity
          # informational hits (asserts; an env-var-name string mis-flagged as a
          # secret), which are not gating.
          bandit -r src/ --severity-level medium
